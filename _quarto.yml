bibliography: references.bib

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    footnotes-hover: true
    code-copy: true
    code-link: true
    code-overflow: wrap
    fig-align: center
    link-external-icon: false
    link-external-newwindow: true
    email-obfuscation: javascript

    # Optional: configure this for your own domain later.
    # The template author's domain has been removed.
    # link-external-filter: '^(?:http:|https:)\/\/YOUR-USERNAME\.github\.io'

    include-in-header: "files/includes/_academic.qmd"
