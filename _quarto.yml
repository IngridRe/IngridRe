project:
  type: website
  output-dir: docs

# Meta
description-meta: >-
  Ingrid Rebane, PhD — materials scientist specialising in polysiloxane
  chemistry, silicone elastomers, formulation, degradation, and analytical
  characterisation. Connecting fundamental chemistry with practical
  materials development.
author-meta: "Ingrid Rebane"

website:
  title: "Ingrid Rebane, PhD"

  # Optional: replace with the path to your own photograph or website image.
  # image: "files/profile-photo.jpg"

  description: >-
    I am a materials scientist specialising in polysiloxane chemistry and
    silicone elastomers, with experience in synthesis, formulation,
    degradation, and materials characterisation. My research interests
    include gas evolution and outgassing, functional silicone composites,
    and the relationships between chemical composition, processing,
    and material performance.

  navbar:
    background: light

    left:
      - text: Home
        href: index.qmd

      - text: About
        menu:
          # Uncomment these items after replacing the template content.
          # - text: News
          #   href: posts.qmd#category=news
          # - text: Events
          #   href: posts.qmd#category=event
          - text: Contact
            href: contact.qmd

      - text: Research
        menu:
          - text: Publications
            href: publications.qmd

          # Uncomment after adding your own selected papers.
          # - text: Selected Papers
          #   href: posts.qmd#category=paper

          # Uncomment after replacing the sample projects.
          # - text: Research Projects
          #   href: projects.qmd

      # Uncomment after adding your own teaching information.
      # - text: Teaching
      #   href: teaching.qmd

      # Uncomment after adding your own presentations.
      # - text: Outreach
      #   menu:
      #     - text: Presentations
      #       href: posts.qmd#category=presentation

      # Uncomment only if you want a group or collaborators page.
      # - text: Group
      #   href: people.qmd

    # Uncomment this section after uploading your own CV
    # and replacing the example GitHub address.
    # right:
    #   - text: CV
    #     href: files/Ingrid-Rebane-CV.pdf
    #   - icon: github
    #     href: "https://github.com/YOUR-USERNAME"
    #     target: _blank

  page-navigation: true

  page-footer:
    left: "Ingrid Rebane &copy; <script>document.write(new Date().getFullYear())</script>"
    center: "Built with [Quarto Academic Website Template](https://github.com/drganghe/quarto-academic-website-template), adapted by [Dr. Gang He](http://drganghe.github.io)"

    # Uncomment after replacing YOUR-USERNAME.
    # right:
    #   - icon: github
    #     href: "https://github.com/YOUR-USERNAME"
    #     target: _blank

  search:
    location: navbar
    type: textbox

  reader-mode: true

  draft-mode: unlinked

  # Uncomment after replacing this with your own repository address.
  # repo-url: "https://github.com/YOUR-USERNAME/YOUR-REPOSITORY"
  # repo-actions: [edit, issue, source]

  open-graph: true

  twitter-card: true

  # Uncomment after replacing this with your published website address.
